connectors:
  Power:
    pins: [A, B, C, D]
    pinlabels: [5V, GND, GND, 12V]
#    hide_disconnected_pins: true
  USB 1:
    type: USB A
    pinlabels: [VBUS, D-, D+, GND]
  USB 2:
    type: USB A
    pinlabels: [VBUS, D-, D+, GND]
  S_5V:
    style: simple
    type: Splice
  S_GND:
    style: simple
    type: Splice

cables:
  W1:
    wirecount: 2
    colors: [RD, BK]
  W2:
    wirecount: 2
    colors: [RD, BK]
  W3:
    wirecount: 2
    colors: [RD, BK]
  LOOP1:
    wirecount: 1
    colors: [GY]
  LOOP2:
    wirecount: 1
    colors: [GN]

connections:
  -
    - Power: [A, B]
    - W1: [1-2]
    - [S_5V, S_GND]
  -
    - [S_5V, S_GND]
    - W2: [1-2]
    - USB 1: [1, 4]
  -
    - [S_5V, S_GND]
    - W3: [1-2]
    - USB 2: [1, 4]
#~~~ D-/D+ shorted at each port by a wire loop
  -
    - LOOP1: [1]
    - USB 1: [2]
  -
    - LOOP1: [1]
    - USB 1: [3]
  -
    - LOOP2: [1]
    - USB 2: [2]
  -
    - LOOP2: [1]
    - USB 2: [3]
