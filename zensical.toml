[project]
site_name = "Zero SR/S Wire Harness"
site_description = "Wiring harness documentation traced from a Zero Motorcycles SR/S (Gen3 FST platform)."
site_url = "https://atomicdog.github.io/ZeroMotoWireharness/"
repo_url = "https://github.com/atomicdog/ZeroMotoWireharness"
repo_name = "atomicdog/ZeroMotoWireharness"
docs_dir = "docs"
site_dir = "site"

[project.theme]
language = "en"
features = [
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
